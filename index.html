document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n le=\"display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--color-divider);background:#fff;padding-bottom:env(safe-area-inset-bottom)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ obBack }}\" style=\"appearance:none;border:0;border-right:1px solid var(--color-neutral-300);background:#fff;padding:18px;text-align:left;font-family:var(--font-body);font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-text);cursor:pointer;min-height:56px\" style-hover=\"background:var(--color-neutral-200)\" style-active=\"background:var(--color-neutral-300)\">{{ t.nav.back }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ obFinish }}\" style=\"appearance:none;border:0;background:var(--color-accent);padding:18px;text-align:left;font-family:var(--font-body);font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:#fff;cursor:pointer;min-height:56px\" style-hover=\"background:var(--color-accent-600)\" style-active=\"background:var(--color-accent-700)\">{{ obFinishLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  static SHORT = {\n    \"Warm-up and activation\": \"Warm-up\",\n    \"Ball control and dribbling\": \"Dribbling\",\n    \"Passing and receiving\": \"Passing\",\n    \"Shooting and finishing\": \"Shooting\",\n    \"Defending one against one\": \"Defending\",\n    \"Small-sided games\": \"Games\",\n    \"Fitness and agility\": \"Fitness\",\n    \"Goalkeeping\": \"Goalkeeping\",\n    \"Corners and set pieces\": \"Corners\"\n  };\n\n  static T(key, vars) {\n    return window.I18N ? window.I18N.t(key, vars) : '';\n  }\n\n  static content(item, field) {\n    if (window.I18N) return window.I18N.content(item, field);\n    return item && item[field] != null ? item[field] : '';\n  }\n\n  static fmtDate(d) {\n    try {\n      return new Intl.DateTimeFormat(window.I18N ? window.I18N.locale : 'en',\n        { day: 'numeric', month: 'short', year: 'numeric' }).format(d);\n    } catch (e) { return d.toDateString(); }\n  }\n\n  static mins(d) {\n    return d && d.durationMinutes != null ? Component.T('count.minutes', { n: d.durationMinutes }) : '';\n  }\n\n  static FAV_KEY = 'u12-drill-favourites';\n\n  static readFavs() {\n    try {\n      const raw = JSON.parse(localStorage.getItem(Component.FAV_KEY) || '[]');\n      return Array.isArray(raw) ? raw.filter((x) => typeof x === 'string') : [];\n    } catch (e) { return []; }\n  }\n\n  static SESSION_KEY = 'u12-drill-session';\n  static META_KEY = 'u12-session-meta';\n  static DUR_KEY = 'u12-session-durations';\n  static EG_KEY = 'u12-session-endgame';\n  static SAVED_KEY = 'u12-saved-sessions';\n  static RUN_KEY = 'u12-run-state';\n  static ONBOARD_KEY = 'u12-onboarded';\n  static COACH_AGES_KEY = 'u12-coach-ages';\n  static TARGETS = [45, 60, 75, 90];\n  static AGES = ['U8', 'U10', 'U12', 'U14', 'U16'];\n  static VERSION = '1.2.0';\n  static KIT_VOCAB = [\n    ['cones', /cone/],\n    ['balls', /ball/],\n    ['bibs', /bib/],\n    ['small goals', /small goal|cone goal/],\n    ['goals', /goal/],\n    ['keeper', /keeper|glove/]\n  ];\n  static NUMWORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];\n  static EMPTY_FILTERS = { ages: [], cats: [], diffs: [], kit: [], players: null, maxDur: null };\n  static DATES_KEY = 'u12-training-dates';\n  static TRAIN_KEY = 'u12-training-time';\n  static TRAIN_DEFAULT = { start: '18:00', end: '19:30' };\n  static COACH_KEY = 'u12-coach';\n  static COACH_DEFAULT = { first: '', last: '', count: 4 };\n  static PLAN_KEY = 'u12-club-plans';\n  static NOTICE_KEY = 'u12-club-notices';\n\n  static CLUB_NAME = 'Fairfield Rovers';\n  static HOUR = 3600000;\n  static DAY = 86400000;\n\n\n  static plainName(name) {\n    const s = (name || '').trim();\n    if (!s) return '';\n    if (/\\d{1,2}\\s+\\w{3,}\\s+\\d{4}/.test(s)) return '';\n    if (/^\\d{1,4}[\\/-]\\d{1,2}[\\/-]\\d{1,4}$/.test(s)) return '';\n    return s;\n  }\n\n  // Same wording as today(), for an arbitrary evening.\n  // True when a name already tells the reader a date, in which case the CTA\n  // must not also append its own \"for <evening>\" clause.\n  static namesADate(name) {\n    const s = (name || '').trim();\n    if (!s) return false;\n    return /\\d{1,2}(st|nd|rd|th)\\b/i.test(s)\n      || /\\d{1,2}\\s*\\w{3,}\\s*\\d{2,4}/.test(s)\n      || /\\d{1,4}[\\/-]\\d{1,2}[\\/-]\\d{1,4}/.test(s)\n      || /\\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i.test(s)\n      || /\\b(tonight|tomorrow|today|mon|tue|wed|thu|fri|sat|sun)/i.test(s);\n  }\n\n  static dateStamp(ts) {\n    try {\n      return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });\n    } catch (e) { return ''; }\n  }\n\n  static dayKey(ts) {\n    const d = new Date(ts);\n    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n  }\n\n  static initialsOf(first, last) {\n    const a = (first || '').trim().charAt(0);\n    const b = (last || '').trim().charAt(0);\n    const s = (a + b).toUpperCase();\n    return s || '??';\n  }\n\n  // \"Tonight\" / \"Tomorrow\" / \"Saturday 21st\" — the phrasing used in notices too.\n  static dateWords(ts) {\n    const d = new Date(ts);\n    const today = new Date();\n    const dk = Component.dayKey(ts);\n    if (dk === Component.dayKey(today.getTime())) return 'tonight';\n    const tm = new Date(today.getTime() + Component.DAY);\n    if (dk === Component.dayKey(tm.getTime())) return 'tomorrow';\n    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\n    const n = d.getDate();\n    const suffix = (n % 10 === 1 && n !== 11) ? 'st' : (n % 10 === 2 && n !== 12) ? 'nd' : (n % 10 === 3 && n !== 13) ? 'rd' : 'th';\n    return days[d.getDay()] + ' ' + n + suffix;\n  }\n\n  static clock(ts) {\n    const d = new Date(ts);\n    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');\n  }\n\n  // Seeded so the screen reads as a working club before the backend exists.\n  static SEED_PLANS = (function () {\n    const now = Date.now();\n    const start = new Date(); start.setHours(18, 0, 0, 0);\n    if (start.getTime() <= now) start.setDate(start.getDate() + 1);\n    const at = start.getTime();\n    return [\n      { id: 'p1', date: Component.dayKey(at), sessionAt: at, title: 'Passing and Finishing',\n        note: '', drills: [['Dynamic Warm Up', 'Warm-up', 10], ['Passing Gates', 'Passing', 15], ['Shooting Circuit', 'Shooting', 15], ['4v4 Match', 'Games', 20]],\n        byFirst: 'Andy', byLast: 'Reid', initials: 'AR', createdAt: now - 4 * 3600000, editedAt: null, version: 1, status: 'superseded' },\n      { id: 'p2', date: Component.dayKey(at), sessionAt: at, title: 'Transition and pressing',\n        note: 'Pitch is waterlogged at the far end, keeping everything in one half.',\n        drills: [['Rondo Warm Up', 'Warm-up', 10], ['Press and Cover', 'Defending', 20], ['Counter Attack 3v2', 'Attacking', 15], ['Small-sided Match', 'Games', 15]],\n        byFirst: 'Priya', byLast: 'Shah', initials: 'PS', createdAt: now - 90 * 60000, editedAt: null, version: 2, status: 'active' }\n    ];\n  })();\n\n  state = {\n    cats: null, i: 0, favs: Component.readFavs(),\n    session: Component.readList(Component.SESSION_KEY),\n    justAdded: false,\n    onboarded: (function () { try { return localStorage.getItem(Component.ONBOARD_KEY) === '1'; } catch (e) { return true; } })(),\n    obStep: 0,\n    locale: (window.I18N ? window.I18N.locale : 'en'),\n    coachAges: Component.readList(Component.COACH_AGES_KEY),\n    meta: Component.readObj(Component.META_KEY, { name: '', age: '', players: 12, target: 60 }),\n    durs: Component.readObj(Component.DUR_KEY, {}),\n    endGame: Component.readObj(Component.EG_KEY, null),\n    saved: (function () { const v = Component.readObj(Component.SAVED_KEY, []); return Array.isArray(v) ? v : []; })(),\n    savedFlash: false, confirmClear: false, confirmDelete: null, openSaved: null,\n    // Club planning. Last write wins, tagged by author; no approvals.\n    plans: Component.readObj(Component.PLAN_KEY, null) || Component.SEED_PLANS,\n    notices: Component.readObj(Component.NOTICE_KEY, []) || [],\n    coach: Object.assign({}, Component.COACH_DEFAULT, Component.readObj(Component.COACH_KEY, {}) || {}),\n    training: Object.assign({}, Component.TRAIN_DEFAULT, Component.readObj(Component.TRAIN_KEY, {}) || {}),\n    trainingDates: Component.readObj(Component.DATES_KEY, null) || [],\n    calMonth: null,\n    openPlan: null, planStage: null, submitAt: null, historyOpen: false,\n    inboxOpen: false, fromMsg: false,\n    dataConfirm: null, aboutOpen: false, privacyOpen: false,\n    shareFlash: false, sharedIn: false, pendingShare: null,\n    filters: Object.assign({}, Component.EMPTY_FILTERS), q: '',\n    run: null\n  };\n\n  get coach() {\n    return Object.assign({}, Component.COACH_DEFAULT, this.state.coach || {});\n  }\n\n  myInitials() {\n    const c = this.coach;\n    return Component.initialsOf(c.first, c.last);\n  }\n\n  // Name is optional in Settings, so notices need a readable fallback.\n  myLabel() {\n    const c = this.coach;\n    return (c.first || c.last) ? this.myInitials() : 'A coach';\n  }\n\n  setCoach(key, value) {\n    this.setState((s) => {\n      const coach = Object.assign({}, Component.COACH_DEFAULT, s.coach, { [key]: value });\n      this.put(Component.COACH_KEY, coach);\n      return { coach };\n    });\n  }\n\n  // The next time training starts, from the configured window.\n  // \"19th Sept\" — the form the chip reads.\n  static dayMonth(ts) {\n    const d = new Date(ts);\n    return Component.ordinal(d.getDate()) + ' ' + Component.MONTHS[d.getMonth()].slice(0, 4).replace(/^Jun.$/, 'June').replace(/^Jul.$/, 'July');\n  }\n\n  static ordinal(n) {\n    const s = (n % 10 === 1 && n !== 11) ? 'st' : (n % 10 === 2 && n !== 12) ? 'nd' : (n % 10 === 3 && n !== 13) ? 'rd' : 'th';\n    return n + s;\n  }\n\n  static MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];\n\n  // Scheduled evening, as a timestamp at the configured start time.\n  startOn(dateKey) {\n    const p = String(dateKey).split('-').map(Number);\n    const t = String((this.state.training || Component.TRAIN_DEFAULT).start || '18:00').split(':');\n    const d = new Date(p[0], (p[1] || 1) - 1, p[2] || 1);\n    d.setHours(parseInt(t[0], 10) || 0, parseInt(t[1], 10) || 0, 0, 0);\n    return d.getTime();\n  }\n\n  // Scheduled dates still to come, soonest first. An evening counts as current\n  // until training finishes, so a session being run now stays \"tonight\".\n  upcomingDates() {\n    const tr = this.state.training || Component.TRAIN_DEFAULT;\n    const endParts = String(tr.end || '19:30').split(':');\n    const now = Date.now();\n    return (this.state.trainingDates || []).slice().sort().filter((k) => {\n      const p = k.split('-').map(Number);\n      const d = new Date(p[0], p[1] - 1, p[2]);\n      d.setHours(parseInt(endParts[0], 10) || 23, parseInt(endParts[1], 10) || 59, 0, 0);\n      return d.getTime() >= now;\n    });\n  }\n\n  shiftMonth(step) {\n    this.setState((s) => {\n      const base = s.calMonth ? new Date(s.calMonth) : new Date();\n      const d = new Date(base.getFullYear(), base.getMonth() + step, 1);\n      return { calMonth: d.getTime() };\n    });\n  }\n\n  toggleTrainingDate(key) {\n    this.setState((s) => {\n      const has = (s.trainingDates || []).indexOf(key) > -1;\n      const trainingDates = has\n        ? s.trainingDates.filter((k) => k !== key)\n        : (s.trainingDates || []).concat([key]).sort();\n      this.put(Component.DATES_KEY, trainingDates);\n      return { trainingDates };\n    });\n  }\n\n  atToday(hhmm, fallback) {\n    const parts = String(hhmm || fallback).split(':');\n    const d = new Date();\n    d.setHours(parseInt(parts[0], 10) || 0, parseInt(parts[1], 10) || 0, 0, 0);\n    return d.getTime();\n  }\n\n  nextSessionStart() {\n    const sched = this.upcomingDates();\n    if (sched.length) return this.startOn(sched[0]);\n    const tr = this.state.training || Component.TRAIN_DEFAULT;\n    const start = this.atToday(tr.start, Component.TRAIN_DEFAULT.start);\n    const end = this.atToday(tr.end, Component.TRAIN_DEFAULT.end);\n    // Tonight remains the session in play until training finishes.\n    if (Date.now() <= Math.max(start, end)) return start;\n    const d = new Date(start);\n    d.setDate(d.getDate() + 1);\n    return d.getTime();\n  }\n\n  setTraining(key, value) {\n    if (!value) return;\n    this.setState((s) => {\n      const training = Object.assign({}, s.training, { [key]: value });\n      if (training.end <= training.start) {\n        const p = training.start.split(':');\n        const d = new Date();\n        d.setHours(parseInt(p[0], 10) || 0, (parseInt(p[1], 10) || 0) + 90, 0, 0);\n        training.end = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');\n      }\n      this.put(Component.TRAIN_KEY, training);\n      return { training };\n    });\n  }\n\n  // First training start on a later day than the one given.\n  startAfterDay(ts) {\n    const sched = this.upcomingDates();\n    if (sched.length) {\n      const key = Component.dayKey(ts);\n      const next = sched.find((k) => k > key);\n      if (next) return this.startOn(next);\n    }\n    const from = new Date(ts).toDateString();\n    let t = ts;\n    let guard = 0;\n    while (new Date(t).toDateString() === from && guard < 14) {\n      const d = new Date(t);\n      d.setDate(d.getDate() + 1);\n      t = d.getTime();\n      guard += 1;\n    }\n    return t;\n  }\n\n  // The agreed plan for the evening currently in play, if training has not\n  // finished yet. Independent of the configured schedule.\n  // Everything the Settings panel can change, as one comparable value.\n  settingsSignature() {\n    return JSON.stringify([this.state.meta, this.state.coach, this.state.training,\n      this.state.trainingDates, this.state.locale, this.state.coachAges]);\n  }\n\n  planInPlay() {\n    const tr = this.state.training || Component.TRAIN_DEFAULT;\n    const end = this.atToday(tr.end, Component.TRAIN_DEFAULT.end);\n    const start = this.atToday(tr.start, Component.TRAIN_DEFAULT.start);\n    if (Date.now() > Math.max(start, end)) return null;\n    return this.activeFor(Component.dayKey(Date.now()));\n  }\n\n  plansFor(date) {\n    return (this.state.plans || []).filter((p) => p.date === date).sort((x, y) => x.createdAt - y.createdAt);\n  }\n\n  activeFor(date) {\n    return this.plansFor(date).find((p) => p.status === 'active') || null;\n  }\n\n  // Dates with a plan, soonest first, past evenings dropped.\n  planDates() {\n    const cutoff = Date.now() - 12 * Component.HOUR;\n    const seen = {};\n    (this.state.plans || []).forEach((p) => {\n      if (p.sessionAt < cutoff) return;\n      if (!seen[p.date] || p.sessionAt < seen[p.date]) seen[p.date] = p.sessionAt;\n    });\n    return Object.keys(seen).sort((a, b) => seen[a] - seen[b]);\n  }\n\n  isMine(p) {\n    if (!p) return false;\n    const c = this.coach;\n    if (!c.first && !c.last) return false;\n    return p.byFirst === c.first && p.byLast === c.last;\n  }\n\n  // Local notice log. Real push needs a server and APNs; this records the event\n  // and fires a device notification when the user has granted permission.\n  // Two distinct paths. `log` records what I did, for my own reference, and is\n  // never unread. `notify` is what arrives from another coach: it badges and\n  // fires a device notification. The backend will call the latter on the\n  // recipients' devices; locally only the log runs.\n  log(text) {\n    this.setState((s) => {\n      const notices = [{ id: 'n' + Date.now(), text, at: Date.now(), mine: true }].concat(s.notices || []).slice(0, 8);\n      this.put(Component.NOTICE_KEY, notices);\n      return { notices };\n    });\n  }\n\n  notify(text) {\n    this.setState((s) => {\n      const notices = [{ id: 'n' + Date.now(), text, at: Date.now(), mine: false }].concat(s.notices || []).slice(0, 8);\n      this.put(Component.NOTICE_KEY, notices);\n      return { notices };\n    });\n    try {\n      if (window.Notification && Notification.permission === 'granted') {\n        new Notification('The Coach', { body: text });\n      }\n    } catch (e) {}\n  }\n\n  // Last write wins: a new submission supersedes whatever was active for that\n  // date and takes the next version number. Nothing is deleted.\n  submitPlan(sessionDrills, name, note) {\n    const drills = sessionDrills.map((d) => [\n      Component.content(d, 'title'),\n      this._catOf ? (this._catOf[d.id] || '') : '',\n      this.minutesFor(d.id, this.state.durs),\n      d.id\n    ]);\n    if (!drills.length) return;\n    const at = this.state.submitAt || this.nextSessionStart();\n    const date = Component.dayKey(at);\n    const prior = this.activeFor(date);\n    const c = this.coach;\n    const mine = this.isMine(prior);\n    const title = (name || '').trim() || 'Session for ' + Component.dateWords(at);\n\n    if (prior && mine) {\n      // My own change is an edit, not a new version.\n      this.setState((s) => {\n        const plans = s.plans.map((p) => p.id === prior.id\n          ? Object.assign({}, p, { title, note: note || '', drills, editedAt: Date.now() })\n          : p);\n        this.put(Component.PLAN_KEY, plans);\n        return { plans, planStage: null, openPlan: prior.id, fromMsg: false };\n      });\n      this.log('You updated your session for ' + Component.dateWords(at) + '. The others have been told.');\n      return;\n    }\n\n    const version = this.plansFor(date).reduce((n, p) => Math.max(n, p.version || 0), 0) + 1;\n    const entry = {\n      id: 'p' + Date.now(), date, sessionAt: at, title, note: note || '', drills,\n      byFirst: c.first, byLast: c.last, initials: this.myInitials(),\n      createdAt: Date.now(), editedAt: null, version, status: 'active'\n    };\n    this.setState((s) => {\n      const plans = s.plans.map((p) => (p.date === date && p.status === 'active')\n        ? Object.assign({}, p, { status: 'superseded' })\n        : p).concat([entry]);\n      this.put(Component.PLAN_KEY, plans);\n      return { plans, planStage: null, openPlan: entry.id, fromMsg: false };\n    });\n    if (prior) {\n      this.log('You replaced ' + (prior.initials && prior.initials !== '??' ? prior.initials + \"'s\" : 'the previous') + ' session for ' + Component.dateWords(at) + '.');\n    } else {\n      this.log('You put up the session for ' + Component.dateWords(at) + '.');\n    }\n  }\n\n  // Load a plan's drills into my builder so I can edit or riff on it.\n  // Resolve a plan's drills to library ids: the stored id when present,\n  // otherwise a title match, so seeded and legacy plans still load.\n  resolvePlan(p) {\n    if (!p || !p.drills) return null;\n    const idx = this._idByTitle || {};\n    const out = [];\n    for (const d of p.drills) {\n      const id = d[3] || idx[String(d[0] || '').toLowerCase()];\n      if (!id) return null;\n      out.push([id, d[2]]);\n    }\n    return out;\n  }\n\n  loadPlan(p) {\n    const pairs = this.resolvePlan(p);\n    if (!pairs) return;\n    const ids = pairs.map((x) => x[0]);\n    this.setState((s) => {\n      const durs = Object.assign({}, s.durs);\n      pairs.forEach((x) => { durs[x[0]] = x[1]; });\n      this.persistSession(ids);\n      this.put(Component.DUR_KEY, durs);\n      return { session: ids, durs, inboxOpen: false, openPlan: null, planStage: null };\n    });\n    const i = (this.stat eMins, base64url in the\n  // URL fragment so nothing ever leaves the device except the link the coach sends.\n  static b64e(str) {\n    return btoa(unescape(encodeURIComponent(str))).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '');\n  }\n\n  static b64d(code) {\n    let s = String(code).replace(/-/g, '+').replace(/_/g, '/');\n    while (s.length % 4) s += '=';\n    return decodeURIComponent(escape(atob(s)));\n  }\n\n  shareCode() {\n    const s = this.state, m = s.meta || {};\n    const pairs = (s.session || []).map((id) => id + ':' + this.minutesFor(id, s.durs)).join(',');\n    const parts = ['v1', m.name || '', m.target || '', m.players || '', m.age || '', pairs, s.endGame ? s.endGame.mins : ''];\n    return Component.b64e(parts.join('|'));\n  }\n\n  shareLink() {\n    const base = location.origin + location.pathname;\n    return base + '#s=' + this.shareCode();\n  }\n\n  shareText() {\n    const s = this.state, m = s.meta || {};\n    const byId = {};\n    (s.cats || []).forEach((c) => (c.drills || []).forEach((d) => { byId[d.id] = d; }));\n    const lines = (s.session || []).map((id, n) => {\n      const d = byId[id];\n      return (n + 1) + '. ' + (d ? Component.content(d, 'title') : id) + ' — ' + this.minutesFor(id, s.durs) + ' min';\n    });\n    if (s.endGame) lines.push((lines.length + 1) + '. ' + Component.T('endgame.title') + ' — ' + s.endGame.mins + ' min');\n    const head = (m.name || Component.T('session.title')) + (m.target ? ' (' + m.target + ' min)' : '');\n    return [head, ''].concat(lines).concat(['', this.shareLink()]).join('\\n');\n  }\n\n  shareSession() {\n    const text = this.shareText();\n    const done = () => {\n      this.setState({ shareFlash: true });\n      clearTimeout(this._shareTimer);\n      this._shareTimer = setTimeout(() => this.setState({ shareFlash: false }), 2200);\n    };\n    if (navigator.share) {\n      navigator.share({ title: Component.T('share.title'), text: text }).then(done).catch(() => {});\n      re
